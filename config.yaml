# ============================================================
# LIFE configuration
# Everything tunable lives here - no code edits needed to retune.
# ============================================================

source:
  # type: webcam | file | rtsp | demo
  #   webcam -> path is the device index (0, 1, ...)
  #   file   -> path is a video file path
  #   rtsp   -> path is an rtsp:// url
  #   demo   -> synthetic flickering-fire clip (no hardware needed, great for a first run)
  type: demo
  path: 0
  width: 1280
  height: 720
  loop: true

processing:
  max_fps: 15

object_detector:
  enabled: false
  model: yolo26n.pt
  conf: 0.35
  device: cpu
  person_label: person

detectors:
  fall:
    enabled: true
    horizontal_angle: 55.0
    fall_velocity: 0.30
    velocity_window_sec: 0.8
    aspect_ratio_wide: 1.1
    ground_persistence_frames: 6
    vote_threshold: 2
    min_visibility: 0.5

  fire:
    enabled: true
    model: models/fire.pt
    conf: 0.40
    heuristic:
      enabled: true
      min_area_ratio: 0.0015
      flicker_frames: 4

  weapon:
    enabled: true
    model: models/weapon.pt
    conf: 0.40
    labels: [knife, gun, pistol, rifle, firearm, weapon]
    proximity_ratio: 1.6

fusion:
  rules:
    - name: confirmed_fall
      signal: fall
      event_type: FALL
      severity: HIGH
      responder: EMS
      min_confidence: 0.50
      min_persistence: 1
      cooldown_seconds: 30

    - name: fire_detected
      signal: fire
      event_type: FIRE
      severity: CRITICAL
      responder: FIRE
      min_confidence: 0.40
      min_persistence: 3
      cooldown_seconds: 30

    - name: smoke_detected
      signal: smoke
      event_type: SMOKE
      severity: HIGH
      responder: FIRE
      min_confidence: 0.40
      min_persistence: 4
      cooldown_seconds: 45

    - name: weapon_present
      signal: weapon
      event_type: WEAPON
      severity: HIGH
      responder: POLICE
      min_confidence: 0.40
      min_persistence: 2
      cooldown_seconds: 30

    - name: weapon_threat
      signal: weapon_threat
      event_type: WEAPON_THREAT
      severity: CRITICAL
      responder: POLICE
      min_confidence: 0.40
      min_persistence: 1
      cooldown_seconds: 20

  combinations:
    - name: fire_with_person
      requires: [fire, person]
      event_type: FIRE_WITH_PERSON
      severity: CRITICAL
      responder: FIRE
      min_persistence: 3
      cooldown_seconds: 30

alarm:
  enabled: false
  min_severity: HIGH

notifications:
  responders:
    EMS:
      name: "Emergency Medical Services"
      contact: "108"

    FIRE:
      name: "Fire Department"
      contact: "101"

    POLICE:
      name: "Police"
      contact: "100"

  adapters:
    console:
      enabled: true

    webhook:
      enabled: false
      url: "http://localhost:9000/alert"

    email:
      enabled: false

    sms:
      enabled: false

storage:
  snapshots_dir: data/snapshots
  log_file: data/events.jsonl

server:
  host: 127.0.0.1
  port: 8000